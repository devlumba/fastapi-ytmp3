<div class="content-section border m-2" style="padding: 2px;">
<p class="h1">{{ yt_info.yt_title }}</p>
<pre class="h5" style="white-space: pre-wrap; word-wrap: break-word;">{{ yt_info.yt_desc }}</pre>
<h2>date published: {{ yt_info.yt_publish_date }}, author= <a href="{{ yt_info.yt_channel_url }}">
    {{ yt_info.yt_author }}</a> ({{ yt_info.yt_channel_follower_count }} subscribers) </h2>
<h2>Views Count: {{ yt_info.yt_views }}, Length: {{ yt_info.yt_length }} </h2>
</div>


<div class="content-section border m-2">
    <form action=""></form>
    <button hx-post="/initiate_download?link={{ yt_info.yt_video_url }}" hx-swap="innerHTML" class="btn btn-primary"
    hx-target="#download-button">Start the Download</button>
    <a hx-boost="false" href="/grab_a_file?filename={{ yt_info.yt_thumbnail_name | urlencode }}" class="btn btn-primary">Download Thumbnail</a>
</div>

<div id="download-button">
</div>
