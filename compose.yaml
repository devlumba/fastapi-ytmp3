services:
  fastapi-ytmp3:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    command:
      uvicorn fastapi-ytmp3-working-dir.ytmp3:app --reload --host 0.0.0.0 --port 8000
    container_name: fastapi-ytmp3
  worker:
    build: .
    volumes:
      - .:/code
    command:
      celery --app=fastapi-ytmp3-working-dir.ytmp3.celery_app worker --pool=gevent -l info
    depends_on:
      - redis
  redis:
    image: redis
    ports:
      - "6379:6379"
  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
